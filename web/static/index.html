<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闲鱼 RAG Agent 可视化平台</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.8.4/dist/index.css">
  <style>
    html, body, #app { margin: 0; height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .layout { display: flex; height: 100vh; }
    .sidebar { width: 210px; background: #001529; color: #fff; flex-shrink: 0; overflow-y: auto; }
    .sidebar .logo { padding: 18px 16px; font-size: 16px; font-weight: 600; border-bottom: 1px solid #1f2d3d; color: #409eff; }
    .sidebar .el-menu { border-right: none; background: transparent; }
    .sidebar .el-menu-item { color: #bfcbd9; }
    .sidebar .el-menu-item.is-active { color: #fff; background: #1890ff; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .header { height: 52px; background: #fff; border-bottom: 1px solid #e6e6e6; display: flex; align-items: center; padding: 0 20px; font-size: 15px; font-weight: 600; color: #333; }
    .content { flex: 1; overflow-y: auto; padding: 20px; background: #f0f2f5; }
    .stat-card .num { font-size: 28px; font-weight: 700; color: #409eff; }
    .stat-card .label { font-size: 13px; color: #909399; margin-top: 4px; }
    .chat-bubble { padding: 8px 12px; border-radius: 8px; max-width: 70%; word-break: break-all; margin-bottom: 8px; }
    .chat-user { background: #e8f4ff; align-self: flex-end; }
    .chat-bot { background: #f5f5f5; align-self: flex-start; }
    .intent-tag { font-size: 11px; }

    /* 运行日志终端视图 */
    .log-view {
      background: #0f1420; border-radius: 8px; padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px; line-height: 1.7; height: calc(100vh - 330px);
      min-height: 260px; overflow: auto; color: #c8d3e0;
    }
    .log-line { display: flex; gap: 10px; white-space: pre-wrap; word-break: break-word; }
    .log-line:hover { background: #161d2e; }
    .log-time { color: #6b7a90; flex-shrink: 0; }
    .log-level { flex-shrink: 0; width: 64px; font-weight: 600; text-align: center; border-radius: 3px; }
    .log-msg { flex: 1; }
    .lv-DEBUG { color: #7d8ea3; }
    .lv-INFO { color: #4fb3ff; }
    .lv-SUCCESS { color: #4ade80; }
    .lv-WARNING { color: #f5a524; }
    .lv-ERROR, .lv-CRITICAL { color: #ff6b6b; }
    .lv-PLAIN { color: #4b5566; }
    .log-empty { color: #6b7a90; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="importmap">
  {
    "imports": {
      "vue": "https://unpkg.com/vue@3.5.12/dist/vue.esm-browser.js",
      "element-plus": "https://unpkg.com/element-plus@2.8.4/dist/index.full.mjs",
      "element-plus/": "https://unpkg.com/element-plus@2.8.4/"
    }
  }
  </script>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
